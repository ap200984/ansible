---
- name: Create Kubernetes virtual machines one by one
  hosts: kvm-server
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all/main.yml
    - ../group_vars/kvm-server.yml
    - ../group_vars/k8s_k112.yml

  tasks:
    - name: Validate Kubernetes VM definitions
      ansible.builtin.assert:
        that:
          - k8s_cluster_machines is defined
          - k8s_cluster_machines | length > 0
        fail_msg: >-
          Define k8s_cluster_machines in ../group_vars/k8s_k112.yml.

    - name: Create Kubernetes VM
      ansible.builtin.include_role:
        name: create_vm
      vars:
        vm_name: "{{ vm_definition.key }}"
        vm_ip_address: "{{ vm_definition.value.ip_address }}"
        vm_memory_mb: "{{ vm_definition.value.memory_mb | default(512) }}"
        vm_vcpus: "{{ vm_definition.value.vcpus | default(1) }}"
        vm_disk_size_gb: "{{ vm_definition.value.disk_size_gb | default(10) }}"
      loop: "{{ k8s_cluster_machines | dict2items }}"
      loop_control:
        loop_var: vm_definition
        label: "{{ vm_definition.key }}"
