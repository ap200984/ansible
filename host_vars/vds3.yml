---
service_containers:
  - https_proxy

https_proxy_port: 1981
https_proxy_users:
  - username: proxy
    password: "{{ socks5_proxy_password }}"

# Approved public forwarding through the K16 edge router.
https_proxy_nat_router: 10.255.0.112
https_proxy_nat_address: 86.110.170.70
https_proxy_nat_target: 10.9.0.120
https_proxy_nat_user: ansible
https_proxy_nat_ssh_key: ~/.ssh/priv/ansible
https_proxy_nat_jump_command: >-
  ssh -F /dev/null -i ~/.ssh/priv/user -p 19020
  -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ router_known_hosts_file }}
  -W %h:%p user@86.110.170.70

https_proxy_tls_certificate_file: "{{ playbook_dir }}/certificates/vds-proxy-server.crt"
