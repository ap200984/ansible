---
service_containers:
  - speedtest
  - socks5
  - https_proxy
  # - certbot
  # - nginx
  - zabbix_proxy

zabbix_proxy_hostname: vds1
zabbix_proxy_server_host: 10.255.0.5 #217.144.189.206
zabbix_proxy_server_port: 10051
zabbix_proxy_tls_psk_identity: vds1
auditbeat_elastic_apt_repo_enabled: false

wireguard_ospf: true
wireguard_enabled: true
wireguard_interface: wg0
wireguard_addresses:
  - 10.250.1.1/24
wireguard_listen_port: 56685
wireguard_private_key: "{{ wireguard_server_private_key }}"
wireguard_peers:
  - name: mikrotik-3Ekipazhnyi64
    public_key: rUX5DJTmbbehlI6gchyOyWwaZ80nBz6dXI1KdpFlum8=
    source_address: 10.250.1.1
    allowed_ips:
      - 10.250.1.64/32
      - '{{ ekipazh_lan_network }}'
  - name: mikrotik-k16-k21
    public_key: l96oFyJcZem8MXw6CsGTLRHJuV9lmXz4IZ6KN1bWMwQ=
    source_address: 10.250.1.1
    allowed_ips:
      - 10.250.1.21/32

  - name: vds7
    public_key: /COMR2JjUcrx6kyrsVb6rGIvQgCr0oQ26t5A33o+ohk=
    endpoint: 62.60.216.73:56697
    source_address: 10.250.1.1
    allowed_ips: [10.250.1.0/28]

domain: vds1.space
# second_octet: 19
# l2tp_octet: 255
# gre_octet: 254
# subdomains_ports:
#   - speedtest:3005
#   - grafana:3000

# TLS-encrypted forward proxy with HTTPS CONNECT support.
https_proxy_port: 1981
https_proxy_users:
  - username: proxy
    password: "{{ socks5_proxy_password }}"
https_proxy_dns_servers: [1.1.1.1, 8.8.8.8]

https_proxy_tls_certificate_file: "{{ playbook_dir }}/certificates/vds-proxy-server.crt"

# Enable BFD on every active OSPF tunnel; keep daemon timer defaults.
ospf_bfd_enabled: true
ospf_router_id: 10.255.0.1
ospf_restore_manifest: vars/ospf-restore/vds1.vault.yml
ospf_firewall_services:
- ospf-firewall
- chr-native-awg-firewall
ospf_tunnel_services:
- wg-quick@wg0
- awg-quick@wg1
- awg-quick@wg2
- awg-quick@wg3
- awg-quick@wg4
ospf_routing_services:
- amneziawg-routing

# K16 now uses a dedicated native AWG interface with container framing on RouterOS.
k16_amneziawg_enabled: true
ospf_direct_neighbors: [10.250.1.64, 10.250.1.21, 10.250.6.7]

# Misha is behind CGNAT; its dedicated authenticated AWG port accepts roaming endpoints.
misha_amneziawg_enabled: true
