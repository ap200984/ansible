---
service_containers:
  - speedtest
  - socks5
  - https_proxy
  - gitlab
  - gitlab_runner
  - jenkins
  - squid
  - owncloud
  - certbot
  - nginx

second_octet: 20
wg_octet: 253
gre_octet: 254
l2tp_octet: 255
domain: vds04.space
wireguard_mtu: 1340

# Keep GitLab background jobs and its runner idle on the backup.
service_standby_containers: [gitlab_runner]
gitlab_extra_omnibus_config: "sidekiq['enable'] = false;"
service_container_ipv4_addresses:
  jenkins: 172.20.240.100
# Match the primary snapshot's ownCloud 10.16.5 image exactly.
owncloud_image: owncloud/server@sha256:04709093a588335dd4dd5a376d909d4ba732c94441c957f72f95b38559533a2e

wireguard_vds7:
  interface: wg0
  address: 10.250.6.4/24
  remote_address: 10.250.6.7
  public_key: z6O+VxtF4MGKB4hoKLK0jZDCv2Qn6ahTvhVHg3h9/gI=
  port: 56694

# TLS-encrypted forward proxy with HTTPS CONNECT support.
https_proxy_port: 1981
https_proxy_users:
  - username: proxy
    password: "{{ socks5_proxy_password }}"

https_proxy_tls_certificate_file: "{{ playbook_dir }}/certificates/vds4-proxy-server.crt"

# Independent backup identity; application data is managed separately.
ospf_bfd_enabled: true
ospf_router_id: 10.255.0.4
ospf_tunnel_services:
  - wg-quick@wg0
  - wg-quick@wg1
vds4_backup_links:
  - interface: wg0
    address: 10.250.6.4/24
    port: 56694
    remote_address: 10.250.6.7
    endpoint: 62.60.216.73:56694
    cost: 1000
  - interface: wg1
    address: 10.250.2.4/24
    port: 56702
    remote_address: 10.250.2.5
    endpoint: 217.144.189.206:56714
    cost: 200

iptables_container_snat_rules:
  - source: 172.20.240.100/32
    destination: 10.0.0.0/8
    to_source: 10.255.0.4
    comment: jenkins-private-snat
