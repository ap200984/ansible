---
service_containers:
  - speedtest
  - socks5
  - https_proxy
  - postgres
  - zabbix_backend
  - zabbix_frontend
  - grafana
  - ejabberd
  - certbot
  - nginx

zabbix_server: 127.0.0.1
second_octet: 21
wg_octet: 253
gre_octet: 254
l2tp_octet: 255
domain: vds05.space
wireguard_mtu: 1340

wireguard_vds7:
  interface: wg0
  address: 10.250.1.5/24
  old_address: 10.250.5.7/32
  old_remote_address: 10.250.7.5
  remote_address: 10.250.1.7
  public_key: xC+UM4Y6WxSwIq5C7Sq5rnOatQPSj+qDNIN2SOD2gz0=
  port: 56695

# TLS-encrypted forward proxy with HTTPS CONNECT support.
https_proxy_port: 1981
https_proxy_users:
  - username: proxy
    password: "{{ socks5_proxy_password }}"

https_proxy_tls_certificate_file: "{{ playbook_dir }}/certificates/vds-proxy-server.crt"
