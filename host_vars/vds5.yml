---
service_containers:
  - speedtest
  - socks5
  - https_proxy
  - postgres
  - zabbix_backend
  - zabbix_frontend
  - grafana
  - ejabberd
  - certbot
  - nginx

zabbix_server: 127.0.0.1
second_octet: 21
wg_octet: 253
gre_octet: 254
l2tp_octet: 255
domain: vds05.space
wireguard_mtu: 1340

wireguard_vds7:
  interface: wg0
  address: 10.250.6.5/24
  old_address: 10.250.5.7/32
  remote_address: 10.250.6.7
  public_key: xC+UM4Y6WxSwIq5C7Sq5rnOatQPSj+qDNIN2SOD2gz0=
  port: 56695

# TLS-encrypted forward proxy with HTTPS CONNECT support.
https_proxy_port: 1981
https_proxy_users:
  - username: proxy
    password: "{{ socks5_proxy_password }}"

https_proxy_tls_certificate_file: "{{ playbook_dir }}/certificates/vds-proxy-server.crt"

# Enable BFD on every active OSPF tunnel; keep daemon timer defaults.
ospf_bfd_enabled: true
ospf_router_id: 10.255.0.5
ospf_restore_manifest: vars/ospf-restore/vds5.vault.yml
ospf_firewall_services:
- ospf-firewall
- plain-wireguard-firewall
ospf_tunnel_services:
- wg-quick@wg0
- awg-quick@wg1
- wg-quick@wg-vds2
- wg-quick@wg-vds6
ospf_routing_services:
- amneziawg-routing
