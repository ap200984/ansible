---
# Required:
#   vm_name       - libvirt domain name and guest hostname
#   vm_ip_address - static IPv4 address for the guest
#
# Example:
# ansible-playbook -i inventory/k16_k112_server 00_create_vm.yaml \
#   -e vm_name=pgadmin-vm \
#   -e vm_ip_address=10.9.0.202 \
#   -e vm_memory_mb=4096 \
#   -e vm_vcpus=4 \
#   -e vm_disk_size_gb=40

- name: Create a new KVM virtual machine
  hosts: kvm-server
  connection: local
  become: true
  gather_facts: true

  roles:
    - create_vm
