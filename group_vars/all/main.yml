---
ansible_user: ansible
ip_address: "{{ ansible_host }}"

# Shared LAN and tunnel prefixes, available to Linux and localhost RouterOS plays.
k16_k112_main_network: 10.9.0.0/24
k16_k112_k8s_network: 10.9.1.0/24
k16_k112_lan_network: 10.9.0.0/23
ekipazh_lan_network: 10.10.0.0/16
sstp_tunnels_network: 10.250.0.0/24
wireguard_tunnels_network: 10.250.1.0/24
amneziawg_tunnels_network: 10.250.2.0/24
l2tp_tunnels_network: 10.250.3.0/24
gre_tunnels_network: 10.250.4.0/24
loopback_network: 10.255.0.0/24
# Requested dedicated K16 AWG transport; independent of the 10.250.2 mesh.
k16_amneziawg_network: 10.255.2.0/24
internal_networks:
  - '{{ k16_k112_lan_network }}'
  - '{{ ekipazh_lan_network }}'
  - '{{ sstp_tunnels_network }}'
  - '{{ wireguard_tunnels_network }}'
  - '{{ amneziawg_tunnels_network }}'
  - '{{ l2tp_tunnels_network }}'
  - '{{ gre_tunnels_network }}'
  - '{{ loopback_network }}'
tunnel_networks: '{{ internal_networks + [k16_amneziawg_network] }}'

# A transport address belongs to the same node as its OSPF loopback even when
# a connected /24 hides its /32 from the shared AWG interface's OSPF routes.
amneziawg_source_aliases:
  '10.255.0.1/32': [10.250.1.1/32, 10.250.2.1/32]
  '10.255.0.2/32': [10.250.1.2/32, 10.250.2.2/32]
  '10.255.0.5/32': [10.250.1.5/32, 10.250.2.5/32]
  '10.255.0.6/32': [10.250.1.6/32, 10.250.2.6/32, 10.250.4.2/32, 10.250.4.6/32, 10.250.4.14/32, 10.250.4.18/32]
  '10.255.0.8/32': [10.250.1.8/32, 10.250.2.8/32]
  '10.255.0.7/32': [10.250.1.7/32, 10.251.0.7/32]
  '10.255.0.112/32': [10.250.0.112/32, 10.250.3.112/32, 10.255.2.112/32, 10.250.4.1/32]
  '10.255.0.64/32': [10.250.0.64/32, 10.250.1.64/32, 10.250.3.64/32, 10.250.4.5/32]
  '10.255.0.21/32': [10.250.0.21/32, 10.250.1.21/32, 10.250.3.21/32, 10.250.4.13/32]
  '10.255.0.24/32': [10.250.0.24/32, 10.250.3.24/32, 10.255.2.24/32, 10.250.4.17/32]

# The connected mesh /24 selects wg1 for these leaves regardless of the
# loopback's OSPF next hop. Their physical shared-interface next hop is VDS5.
amneziawg_connected_leaf_owners:
  vds1:
    '10.250.2.5': [10.250.2.2/32, 10.250.2.6/32]
  vds8:
    '10.250.2.5': [10.250.2.2/32, 10.250.2.6/32]

# Shared-interface destinations have one owner; direct neighbor /32s take precedence.
ospf_peer_allowed_ips:
  '09+N44Dl/exqOELQAoECIev+VASLf3ki8lxJFDf10Bw=':
    - 10.250.1.112/32
    - 10.250.0.112/32
    - 10.250.3.112/32
    - 10.255.0.112/32
    - '{{ k16_k112_main_network }}'
    - '{{ k16_k112_k8s_network }}'
    - '{{ l2tp_tunnels_network }}'
  'rUX5DJTmbbehlI6gchyOyWwaZ80nBz6dXI1KdpFlum8=':
    - 10.250.1.64/32
    - 10.250.0.64/32
    - 10.250.3.64/32
    - 10.255.0.64/32
    - 10.10.0.0/16
  'l96oFyJcZem8MXw6CsGTLRHJuV9lmXz4IZ6KN1bWMwQ=':
    - 10.250.1.21/32
    - 10.250.0.21/32
    - 10.250.3.21/32
    - 10.255.0.21/32
    - 10.11.0.0/16
  '6BSbDkZdUVEfDVPhe3yrsRlgvnr0i4wT+bXjXppWTVg=':
    - 10.250.1.24/32
    - 10.250.0.24/32
    - 10.250.3.24/32
    - 10.255.0.24/32
  '/COMR2JjUcrx6kyrsVb6rGIvQgCr0oQ26t5A33o+ohk=': '{{ [sstp_tunnels_network, wireguard_tunnels_network, amneziawg_tunnels_network, loopback_network, "10.251.0.0/24"] }}'
  'WHc5K+biGIULJ9YNAuv6XeiyWkUSivZ12FZxMMx2ewA=': '{{ [sstp_tunnels_network, wireguard_tunnels_network, amneziawg_tunnels_network, loopback_network, "10.251.0.0/24"] }}'

service_docker_network:
  name: docker-net
  subnet: 172.20.0.0/16
  iprange: 172.20.240.0/20

# Dedicated AmneziaWG mesh, independent of the ordinary wg0/CHR links.
chr_native_awg_hosts: [vds1, vds8]
linux_wg_normalized_hosts: [] # Consolidation rolled back; CHR identities collide.
amneziawg_host_ports: {vds1: 56702, vds5: 56702, vds8: 56702}
normalized_chr_public_keys:
  vds1: /COMR2JjUcrx6kyrsVb6rGIvQgCr0oQ26t5A33o+ohk=
  vds8: WHc5K+biGIULJ9YNAuv6XeiyWkUSivZ12FZxMMx2ewA=
chr_plain_wg_hosts: [vds2, vds5, vds6]
plain_wg_mesh_leaf_hosts: [vds2, vds6]
chr_amneziawg_transport_enabled: false
amneziawg_enabled: '{{ inventory_hostname in ["vds1", "vds5", "vds8"] }}'
amneziawg_interface: wg1
amneziawg_port: '{{ amneziawg_host_ports.get(inventory_hostname, 56702) }}'
amneziawg_mtu: 1340
amneziawg_ospf_cost: 200
# Break CHR↔vds8's equal-cost paths through vds1/vds5 on both ends.
ospf_wireguard_costs:
  vds1: 1000
  vds2: 1000
  vds5: 1001
  vds6: 1000
  vds8: 30000
amneziawg_peers:
  vds1: [vds5, vds8]
  vds5: [vds1, vds8]
  vds8: [vds5, vds1]
amneziawg_endpoints:
  vds1: 45.141.102.72
  vds2: 38.247.137.237
  vds5: 217.144.189.206
  vds6: 195.245.239.82
  vds8: 194.113.106.136

# BFD timers use FRR/RouterOS defaults; SSTP is the OSPF backup.
ospf_sstp_cost: 60000

# Run router playbooks from the repository root; pin recorded device keys.
router_known_hosts_file: '{{ lookup("env", "PWD") }}/mikrotik/known_hosts'
