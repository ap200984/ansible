---
- name: Apply and persist container source NAT overrides
  hosts: vds6
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: roles/iptables/tasks/container-snat.yml
    - ansible.builtin.file:
        path: /etc/iptables
        state: directory
        mode: '0755'
    - name: Save persistent IPv4 iptables rules
      ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
      changed_when: false
    - name: Enable firewall restoration at boot
      ansible.builtin.systemd_service:
        name: netfilter-persistent
        enabled: true
