---
- name: Validate ELK settings
  ansible.builtin.assert:
    that:
      - elk_version | length > 0
      - elk_elasticsearch_port | int > 0
      - elk_kibana_port | int > 0
      - elk_beats_port | int > 0
      - elk_linux_logs_port | int > 0
      - elk_linux_logs_port | int < 65536
      - elk_mikrotik_logs_port | int > 0
      - elk_mikrotik_logs_port | int < 65536
      - elk_linux_logs_port | int != elk_mikrotik_logs_port | int
      - elk_log_bind_address | length > 0
    fail_msg: ELK version and listening ports must be valid.
  tags: [elk, "elk:validate"]

- name: Validate Kibana integrations proxy settings
  ansible.builtin.assert:
    that:
      - elk_kibana_integrations_proxy_endpoint | length > 0
      - elk_kibana_integrations_proxy_endpoint | urlsplit('scheme') in ['http', 'https']
      - elk_kibana_integrations_proxy_endpoint | urlsplit('hostname') | length > 0
      - elk_kibana_integrations_proxy_user | length > 0
      - elk_kibana_integrations_proxy_password | length > 0
    fail_msg: >-
      Enabling the Kibana integrations proxy requires squid_endpoint,
      squid_user, and squid_pass (or the corresponding
      elk_kibana_integrations_proxy_* overrides).
  when: elk_kibana_integrations_use_proxy | bool
  no_log: true
  tags: [elk, "elk:validate"]

- name: Build authenticated Kibana integrations proxy URL
  ansible.builtin.set_fact:
    elk_kibana_integrations_proxy_url: >-
      {{ elk_kibana_integrations_proxy_endpoint | urlsplit('scheme') }}://{{
      elk_kibana_integrations_proxy_user | urlencode }}:{{
      elk_kibana_integrations_proxy_password | urlencode }}@{{
      elk_kibana_integrations_proxy_endpoint | urlsplit('hostname') }}:{{
      elk_kibana_integrations_proxy_endpoint | urlsplit('port') | default(3128, true) }}
  when: elk_kibana_integrations_use_proxy | bool
  no_log: true
  tags: [elk, "elk:validate", "elk:containers"]

- name: Set the Elasticsearch virtual memory limit
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    sysctl_set: true
    reload: true
  tags: [elk, "elk:system"]

- name: Create ELK configuration and data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ elk_install_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ elk_install_dir }}/elasticsearch", owner: "1000", group: root, mode: "0770" }
    - { path: "{{ elk_install_dir }}/logstash/pipeline", owner: root, group: root, mode: "0755" }
    - { path: "{{ elk_install_dir }}/logstash/staging", owner: root, group: root, mode: "0755" }
    - { path: "{{ elk_install_dir }}/logstash/data", owner: "1000", group: root, mode: "0770" }
  loop_control:
    label: "{{ item.path }}"
  tags: [elk, "elk:config"]

- name: Stage Logstash pipeline for validation
  ansible.builtin.template:
    src: logstash.conf.j2
    dest: "{{ elk_install_dir }}/logstash/staging/logstash.conf"
    owner: root
    group: root
    mode: "0644"
  register: elk_logstash_candidate
  tags: [elk, "elk:config"]

- name: Ensure the Logstash image is available for validation
  community.docker.docker_image:
    name: "{{ elk_logstash_image }}"
    source: pull
  when: not ansible_check_mode
  tags: [elk, "elk:config"]

- name: Validate the candidate with the deployed Logstash version
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - -e
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - --mount
      - "type=bind,source={{ elk_install_dir }}/logstash/staging/logstash.conf,target=/tmp/logstash.conf,readonly"
      - "{{ elk_logstash_image }}"
      - logstash
      - --config.test_and_exit
      - --path.data
      - /tmp/logstash-validation
      - -f
      - /tmp/logstash.conf
  changed_when: false
  when: not ansible_check_mode
  tags: [elk, "elk:config"]

- name: Install validated Logstash pipeline
  ansible.builtin.copy:
    src: "{{ elk_install_dir }}/logstash/staging/logstash.conf"
    dest: "{{ elk_install_dir }}/logstash/pipeline/logstash.conf"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  register: elk_logstash_config
  when: not ansible_check_mode
  tags: [elk, "elk:config"]

- name: Preview Logstash pipeline changes in check mode
  ansible.builtin.template:
    src: logstash.conf.j2
    dest: "{{ elk_install_dir }}/logstash/pipeline/logstash.conf"
    owner: root
    group: root
    mode: "0644"
  when: ansible_check_mode
  tags: [elk, "elk:config"]

- name: Ensure ELK Docker network exists
  community.docker.docker_network:
    name: "{{ elk_network_name }}"
  when: not ansible_check_mode
  tags: [elk, "elk:containers"]

- name: Start Elasticsearch container
  community.docker.docker_container:
    name: elasticsearch
    image: "{{ elk_elasticsearch_image }}"
    pull: missing
    state: started
    restart_policy: unless-stopped
    memory: "{{ elk_elasticsearch_memory }}"
    networks:
      - name: "{{ elk_network_name }}"
    ports:
      - "{{ elk_elasticsearch_port }}:9200"
    volumes:
      - "{{ elk_install_dir }}/elasticsearch:/usr/share/elasticsearch/data"
    env:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
  when: not ansible_check_mode
  tags: [elk, "elk:containers"]

- name: Wait for Elasticsearch API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ elk_elasticsearch_port }}/_cluster/health"
    status_code: 200
    return_content: true
  register: elk_elasticsearch_health
  until: >-
    elk_elasticsearch_health.status | default(0) == 200 and
    elk_elasticsearch_health.json.status | default('') in ['yellow', 'green']
  retries: 30
  delay: 5
  when: not ansible_check_mode
  tags: [elk, "elk:ready"]

- name: Read the managed log index template
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ elk_elasticsearch_port }}/_index_template/ansible-system-logs"
    status_code: [200, 404]
    return_content: true
  register: elk_existing_log_template
  when: not ansible_check_mode
  tags: [elk, "elk:config"]

- name: Install mappings for Linux and MikroTik daily indices
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ elk_elasticsearch_port }}/_index_template/ansible-system-logs"
    method: PUT
    body_format: json
    body: "{{ lookup('ansible.builtin.template', 'logs-index-template.json.j2') | from_json }}"
    status_code: 200
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      elk_existing_log_template.status == 404 or
      elk_existing_log_template.json.index_templates[0].index_template !=
      lookup('ansible.builtin.template', 'logs-index-template.json.j2') | from_json
  tags: [elk, "elk:config"]

- name: Start Logstash container
  community.docker.docker_container:
    name: logstash
    image: "{{ elk_logstash_image }}"
    pull: missing
    state: started
    restart_policy: unless-stopped
    recreate: "{{ elk_logstash_config.changed }}"
    memory: "{{ elk_logstash_memory }}"
    networks:
      - name: "{{ elk_network_name }}"
    ports:
      - "{{ elk_beats_port }}:5044"
      - "{{ elk_log_bind_address }}:{{ elk_linux_logs_port }}:10514/tcp"
      - "{{ elk_log_bind_address }}:{{ elk_mikrotik_logs_port }}:5514/tcp"
    volumes:
      - "{{ elk_install_dir }}/logstash/pipeline:/usr/share/logstash/pipeline:ro"
      - "{{ elk_install_dir }}/logstash/data:/usr/share/logstash/data"
    env:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      QUEUE_TYPE: persisted
      QUEUE_MAX_BYTES: "{{ elk_logstash_queue_max_bytes }}"
      PIPELINE_ECS_COMPATIBILITY: v8
  when: not ansible_check_mode
  tags: [elk, "elk:containers"]

- name: Start Kibana container
  community.docker.docker_container:
    name: kibana
    image: "{{ elk_kibana_image }}"
    pull: missing
    state: started
    restart_policy: unless-stopped
    memory: "{{ elk_kibana_memory }}"
    networks:
      - name: "{{ elk_network_name }}"
    ports:
      - "{{ elk_kibana_port }}:5601"
    env: >-
      {{
        {
          'ELASTICSEARCH_HOSTS': 'http://elasticsearch:9200',
          'SERVER_HOST': '0.0.0.0'
        }
        | combine(
            {
              'XPACK_FLEET_REGISTRYPROXYURL':
                elk_kibana_integrations_proxy_url
            }
            if elk_kibana_integrations_use_proxy | bool
            else {}
          )
      }}
  when: not ansible_check_mode
  no_log: "{{ elk_kibana_integrations_use_proxy | bool }}"
  tags: [elk, "elk:containers"]

- name: Wait for Kibana API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ elk_kibana_port }}/api/status"
    status_code: 200
  register: elk_kibana_health
  until: elk_kibana_health.status == 200
  retries: 40
  delay: 5
  when: not ansible_check_mode
  tags: [elk, "elk:ready"]

- name: Wait for the Logstash Beats listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ elk_beats_port }}"
    timeout: 180
  when: not ansible_check_mode
  tags: [elk, "elk:ready"]

- name: Wait for Linux JSON and RouterOS CEF listeners on the private address
  ansible.builtin.wait_for:
    host: "{{ elk_log_bind_address }}"
    port: "{{ item }}"
    timeout: 180
  loop: ["{{ elk_linux_logs_port }}", "{{ elk_mikrotik_logs_port }}"]
  when: not ansible_check_mode
  tags: [elk, "elk:ready"]
