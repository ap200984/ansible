---
- name: Validate hostname is configured
  assert:
    that:
      - hostname_name | length > 0
    fail_msg: "Set hostname in inventory or override hostname_name for the hostname role."
  tags:
    - hostname
    - "hostname:validate"
    - "hostname:config"

- name: Check for cloud-init configuration directory
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: hostname_cloud_init_config_directory
  tags:
    - hostname
    - "hostname:config"

- name: Preserve the managed hostname across cloud-init runs
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-zz-ansible-hostname.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      #cloud-config
      preserve_hostname: true
  when: hostname_cloud_init_config_directory.stat.isdir | default(false)
  tags:
    - hostname
    - "hostname:config"

- name: Set standards-compliant runtime hostname
  ansible.builtin.hostname:
    name: "{{ hostname_name }}"
  when: "'_' not in hostname_name"
  tags:
    - hostname
    - "hostname:config"

- name: Read runtime hostname for legacy underscore names
  ansible.builtin.command: hostname
  register: hostname_runtime_name
  changed_when: false
  when: "'_' in hostname_name"
  tags:
    - hostname
    - "hostname:config"

- name: Set runtime hostname with legacy underscore support
  ansible.builtin.command:
    argv:
      - sysctl
      - -w
      - "kernel.hostname={{ hostname_name }}"
  when:
    - "'_' in hostname_name"
    - hostname_runtime_name.stdout != hostname_name
  tags:
    - hostname
    - "hostname:config"

- name: Configure /etc/hostname
  copy:
    dest: /etc/hostname
    owner: root
    group: root
    mode: "0644"
    content: "{{ hostname_name }}\n"
  tags:
    - hostname
    - "hostname:config"

- name: Ensure localhost entry exists in /etc/hosts
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+'
    line: "127.0.0.1 localhost"
    state: present
  tags:
    - hostname
    - "hostname:config"

- name: Configure hostname entry in /etc/hosts
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1 {{ hostname_fqdn }} {{ hostname_name }}"
    state: present
  tags:
    - hostname
    - "hostname:config"
