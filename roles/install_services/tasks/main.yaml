---
- name: Validate requested container services
  ansible.builtin.assert:
    that:
      - service_containers is sequence
      - service_containers is not string
      - service_containers | unique | length == service_containers | length
      - service_containers | difference(service_catalog.keys() | list) | length == 0
    fail_msg: >-
      Unknown service in service_containers. Available services:
      {{ service_catalog.keys() | sort | join(', ') }}.
  tags:
    - services
    - "services:validate"

- name: Install requested container services
  ansible.builtin.include_tasks:
    file: install_specific_service.yaml
    apply:
      tags:
        - services
        - "{{ service_name }}"
        - "services:{{ service_name }}"
  loop: "{{ service_containers }}"
  loop_control:
    loop_var: service_name
    label: "{{ service_name }}"
  tags:
    - always
