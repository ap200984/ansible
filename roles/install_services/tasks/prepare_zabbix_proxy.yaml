---
- name: Validate Zabbix proxy configuration
  ansible.builtin.assert:
    that:
      - zabbix_proxy_hostname | default('') | string | length > 0
      - zabbix_proxy_server_host | default('') | string | length > 0
      - zabbix_proxy_tls_psk_identity | default('') | string | length > 0
      - zabbix_proxy_psk is defined
      - zabbix_proxy_psk | string | length >= 32
      - zabbix_proxy_psk | string | length <= 512
      - zabbix_proxy_psk | string | length is divisibleby 2
      - zabbix_proxy_psk | string is match('^[0-9a-fA-F]+$')
    fail_msg: >-
      Configure zabbix_proxy_hostname, zabbix_proxy_server_host,
      zabbix_proxy_tls_psk_identity, and a hexadecimal zabbix_proxy_psk
      Vault secret between 32 and 512 characters.
  no_log: true

- name: Build custom Zabbix proxy image
  when: not ansible_check_mode
  block:
    - name: Create temporary Zabbix proxy build directory
      ansible.builtin.tempfile:
        state: directory
        prefix: zabbix-proxy-build-
      register: zabbix_proxy_build_directory
      changed_when: false

    - name: Stage Zabbix proxy Docker build context
      ansible.builtin.copy:
        src: "zabbix_proxy/{{ item }}"
        dest: "{{ zabbix_proxy_build_directory.path }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - Dockerfile
        - deye_modbus_metrics.py
      changed_when: false

    - name: Build Zabbix proxy with Deye Modbus external check
      community.docker.docker_image:
        name: "{{ zabbix_proxy_image }}"
        source: build
        force_source: true
        build:
          path: "{{ zabbix_proxy_build_directory.path }}"
          pull: "{{ zabbix_proxy_build_pull | bool }}"
          args:
            ZABBIX_PROXY_BASE_IMAGE: "{{ zabbix_proxy_base_image }}"
          http_timeout: 600
      register: zabbix_proxy_image_result

    - name: Recreate Zabbix proxy after image changes
      ansible.builtin.set_fact:
        service_force_recreate: true
      when: zabbix_proxy_image_result.changed

  always:
    - name: Remove temporary Zabbix proxy build context
      ansible.builtin.file:
        path: "{{ zabbix_proxy_build_directory.path }}"
        state: absent
      when: zabbix_proxy_build_directory.path is defined
      changed_when: false

- name: Create Zabbix proxy PSK directory
  ansible.builtin.file:
    path: "{{ zabbix_proxy_psk_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Zabbix proxy PSK from Vault
  ansible.builtin.copy:
    dest: "{{ zabbix_proxy_psk_file }}"
    owner: "1997"
    group: "1997"
    mode: "0400"
    content: "{{ zabbix_proxy_psk }}\n"
  register: zabbix_proxy_psk_result
  no_log: true

- name: Recreate Zabbix proxy after PSK changes
  ansible.builtin.set_fact:
    service_force_recreate: true
  when: zabbix_proxy_psk_result.changed
