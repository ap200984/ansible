---
- name: Install POSIX ACL tools for ejabberd certificates
  ansible.builtin.apt:
    name: acl
    state: present

- name: Check ejabberd TLS certificate files
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain }}/{{ item }}"
  loop:
    - fullchain.pem
    - privkey.pem
  register: ejabberd_certificate_files

- name: Validate ejabberd TLS certificate files
  ansible.builtin.assert:
    that:
      - ejabberd_certificate_files.results | map(attribute='stat.exists') | min
    fail_msg: >-
      The Let's Encrypt certificate for {{ domain }} must exist before
      starting ejabberd.

- name: Allow ejabberd to traverse Let's Encrypt directories
  ansible.posix.acl:
    path: "{{ item }}"
    entity: "9000"
    etype: user
    permissions: x
    state: present
  loop:
    - /etc/letsencrypt
    - /etc/letsencrypt/live
    - /etc/letsencrypt/archive

- name: Allow ejabberd to traverse its certificate directories
  ansible.posix.acl:
    path: "{{ item }}"
    entity: "9000"
    etype: user
    permissions: rx
    state: present
  loop:
    - "/etc/letsencrypt/live/{{ domain }}"
    - "/etc/letsencrypt/archive/{{ domain }}"

- name: Allow ejabberd to read its current certificate files
  ansible.posix.acl:
    path: "/etc/letsencrypt/live/{{ domain }}/{{ item }}"
    entity: "9000"
    etype: user
    permissions: r
    state: present
    follow: true
  loop:
    - fullchain.pem
    - privkey.pem

- name: Preserve ejabberd certificate access after renewal
  ansible.posix.acl:
    path: "/etc/letsencrypt/archive/{{ domain }}"
    entity: "9000"
    etype: user
    permissions: r
    default: true
    state: present

- name: Ensure ejabberd database directory exists
  ansible.builtin.file:
    path: /etc/ejabberd/database
    state: directory
    owner: "9000"
    group: "9000"
    mode: "0755"

- name: Render ejabberd configuration
  ansible.builtin.template:
    src: ejabberd/ejabberd.yml.j2
    dest: /etc/ejabberd/ejabberd.yml
    owner: "9000"
    group: "9000"
    mode: "0644"
  register: rendered_ejabberd_configuration

- name: Validate ejabberd source build settings
  ansible.builtin.assert:
    that:
      - ejabberd_version | string is match('^[0-9]+\.[0-9]+$')
      - ejabberd_source_commit | string is match('^[0-9a-f]{40}$')
      - ejabberd_source_image | string | length > 0
      - ejabberd_otp_version | string | length > 0
      - ejabberd_elixir_version | string | length > 0
    fail_msg: >-
      Configure a release version, pinned 40-character source commit, local
      image name, Erlang/OTP version, and Elixir version for the ejabberd
      source build.
  when: ejabberd_build_from_source | bool

- name: Build ejabberd from source
  when:
    - ejabberd_build_from_source | bool
    - not ansible_check_mode
  block:
    - name: Create temporary ejabberd build directory
      ansible.builtin.tempfile:
        state: directory
        prefix: ejabberd-build-
      register: ejabberd_build_directory
      changed_when: false

    - name: Stage ejabberd Docker build context
      ansible.builtin.copy:
        src: ejabberd/Dockerfile
        dest: "{{ ejabberd_build_directory.path }}/Dockerfile"
        owner: root
        group: root
        mode: "0644"
      changed_when: false

    - name: Build native ejabberd image from pinned source
      community.docker.docker_image:
        name: "{{ ejabberd_source_image }}"
        source: build
        force_source: true
        build:
          path: "{{ ejabberd_build_directory.path }}"
          pull: "{{ ejabberd_build_pull | bool }}"
          args:
            EJABBERD_VERSION: "{{ ejabberd_version | string }}"
            EJABBERD_SOURCE_COMMIT: "{{ ejabberd_source_commit | string }}"
            OTP_VERSION: "{{ ejabberd_otp_version | string }}"
            ELIXIR_VERSION: "{{ ejabberd_elixir_version | string }}"
          http_timeout: 3600
      register: ejabberd_source_image_result

    - name: Recreate ejabberd after source image changes
      ansible.builtin.set_fact:
        service_force_recreate: >-
          {{ service_force_recreate | bool
             or ejabberd_source_image_result.changed }}

  always:
    - name: Remove temporary ejabberd build context
      ansible.builtin.file:
        path: "{{ ejabberd_build_directory.path }}"
        state: absent
      when: ejabberd_build_directory.path is defined
      changed_when: false

- name: Recreate ejabberd after configuration changes
  ansible.builtin.set_fact:
    service_force_recreate: >-
      {{ service_force_recreate | bool
         or rendered_ejabberd_configuration.changed }}
