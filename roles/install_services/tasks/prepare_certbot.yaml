---
- name: Validate Certbot settings
  ansible.builtin.assert:
    that:
      - domain | default('') | length > 0
    fail_msg: Certbot requires domain in host_vars.

- name: Ensure Let's Encrypt directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether a certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain }}/cert.pem"
  register: service_certbot_certificate

- name: Bootstrap the Let's Encrypt certificate
  when:
    - not service_certbot_certificate.stat.exists
    - not ansible_check_mode
  block:
    - name: Write Reg.ru DNS credentials
      ansible.builtin.copy:
        dest: /etc/letsencrypt/regru.ini
        owner: root
        group: root
        mode: "0600"
        content: |
          dns_regru_username = {{ regru_login }}
          dns_regru_password = {{ regru_passwd }}
      no_log: true

    - name: Start temporary Certbot bootstrap container
      community.docker.docker_container:
        name: certbot_bootstrap
        image: ubuntu:24.04
        state: started
        command: sleep infinity
        volumes:
          - /etc/letsencrypt:/etc/letsencrypt
        networks:
          - name: "{{ service_docker_network.name }}"

    - name: Install Certbot Reg.ru plugin
      community.docker.docker_container_exec:
        container: certbot_bootstrap
        command: >-
          sh -c 'apt-get update &&
          apt-get install -y python3-pip &&
          pip3 install certbot-dns-regru==1.1.1 --break-system-packages'

    - name: Obtain wildcard certificate
      ansible.builtin.command:
        argv:
          - timeout
          - --signal=TERM
          - 15m
          - docker
          - exec
          - certbot_bootstrap
          - certbot
          - certonly
          - --authenticator
          - dns-regru
          - --domains
          - "{{ domain }}"
          - --domains
          - "*.{{ domain }}"
          - --dns-regru-credentials
          - /etc/letsencrypt/regru.ini
          - --dns-regru-propagation-seconds
          - "180"
          - --email
          - "admin@{{ domain }}"
          - --non-interactive
          - --agree-tos
      changed_when: true

  always:
    - name: Remove temporary Certbot bootstrap container
      community.docker.docker_container:
        name: certbot_bootstrap
        state: absent
