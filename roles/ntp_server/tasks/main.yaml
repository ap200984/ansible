---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: "{{ ntp_server_update_cache }}"
  tags:
    - ntp_server
    - "ntp_server:packages"

- name: Configure chrony as NTP server
  ansible.builtin.copy:
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {% for server in ntp_server_upstream_servers %}
      pool {{ server }} iburst
      {% endfor %}

      {% for network in ntp_server_allow_networks %}
      allow {{ network }}
      {% endfor %}

      keyfile /etc/chrony/chrony.keys
      driftfile /var/lib/chrony/chrony.drift
      logdir /var/log/chrony
      maxupdateskew 100.0
      rtcsync
      makestep 1 3
      local stratum 10
  notify: Restart chrony for NTP server
  tags:
    - ntp_server
    - "ntp_server:config"

- name: Ensure chrony is enabled and started
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started
  tags:
    - ntp_server
    - "ntp_server:service"
