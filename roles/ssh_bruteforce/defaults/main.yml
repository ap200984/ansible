---
ssh_bruteforce_enabled: '{{ inventory_hostname in (ssh_bruteforce_linux_hosts | default([])) }}'
ssh_bruteforce_port: "{{ 22 if inventory_hostname in ['vds3', 'k16_k112_server'] else 19022 }}"
ssh_bruteforce_ipset: Blacklist
ssh_bruteforce_bantime: 1209600
ssh_bruteforce_findtime: 600
ssh_bruteforce_subnet_enabled: true
ssh_bruteforce_subnet_prefix: 24
ssh_bruteforce_subnet_maxretry: 3
