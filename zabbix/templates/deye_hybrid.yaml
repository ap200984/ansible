# Zabbix 7.4: preserve existing cloud metrics and add direct Modbus TCP polling.
zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 7df96b18c230490a9a0a9e2307226338
    name: Templates
  templates:
  - uuid: 34408a93158b41fab58f8cc5fe1e55a1
