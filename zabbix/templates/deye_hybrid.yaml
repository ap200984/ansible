      type: HTTP_AGENT
      key: deye.cloud.raw
      value_type: TEXT
      timeout: 45s
      url: '{$DEYE.PROXY.API.URL}/device/latest'
      post_type: JSON
      posts: '{"api_url":"{$DEYE.API.URL}","app_id":"{$DEYE.APP.ID}","app_secret":"{$DEYE.APP.SECRET}","deviceList":["{$DEYE.DEVICE.SN}"]}'
      headers:
      - name: Content-Type
        value: application/json
      request_method: POST
      verify_host: 'YES'
