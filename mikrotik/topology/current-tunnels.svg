<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<title>Current MikroTik and VDS tunnel topology — 2026-10-05</title>
<desc>Thirteen WireGuard, four SSTP and three L2TP links. Nodes repeat between protocol panels. All Linux WireGuard interfaces are wg0.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#182b45} .title{font-size:30px;font-weight:bold}.heading{font-size:21px;font-weight:bold}.label{font-size:18px;font-weight:bold}.detail{font-size:15px;fill:#51647c}.small{font-size:14px;fill:#51647c}.node{fill:#fff;stroke:#acbed4;stroke-width:1.5}.panel{fill:#f4f7fb;stroke:#dce5ef}.wg{fill:none;stroke:#367bce;stroke-width:3}.sstp{fill:none;stroke:#dd892c;stroke-width:3}.l2tp{fill:none;stroke:#219675;stroke-width:3;stroke-dasharray:9 5}.lan{fill:none;stroke:#7e8ba0;stroke-width:2}
</style></defs>
<rect width="1600" height="1120" fill="#fff"/>
<text x="45" y="53" class="title">MikroTik ↔ VDS · Current tunnel topology</text>
<text x="45" y="83" class="detail">2026-10-05 deployment · Protocol panels repeat nodes for clarity · Retired tunnels omitted</text>
<rect x="30" y="110" width="1540" height="450" rx="18" class="panel"/>
<text x="55" y="146" class="heading">WireGuard · 13 links · 10.250.1.0/24</text>
<text x="55" y="173" class="detail">Every site router connects to both hubs. CHR connects to all five Linux VDSes.</text>
<!-- Eight site-to-hub links, two CHR-to-hub links and three CHR-to-leaf links. -->
<g class="wg">
