<text x="55" y="954" class="heading">K16 LANs · Routed internal traffic, no source NAT within 10.0.0.0/8</text>
<text x="55" y="984" class="detail">Main: 10.9.0.0/24 · Kubernetes: 10.9.1.0/24 · Gateway: K16_112</text>
