<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<title>Current MikroTik and VDS tunnel topology — 2026-10-05</title>
<desc>Thirteen WireGuard, five AmneziaWG, four SSTP and three L2TP links. Ordinary WireGuard uses wg0; AmneziaWG uses wg1. Upper row: vds8, vds7_CHR, vds6. Lower row: vds1, vds5, vds2. Straight tunnel links; crossings are not junctions.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#182b45} .title{font-size:30px;font-weight:bold}.heading{font-size:21px;font-weight:bold}.label{font-size:18px;font-weight:bold}.detail{font-size:15px;fill:#51647c}.small{font-size:14px;fill:#51647c}.node{fill:#fff;stroke:#acbed4;stroke-width:1.5}.panel{fill:#f4f7fb;stroke:#dce5ef}.wg{fill:none;stroke:#367bce;stroke-width:3}.awg{fill:none;stroke:#9b4dca;stroke-width:4}.sstp{fill:none;stroke:#dd892c;stroke-width:3}.l2tp{fill:none;stroke:#219675;stroke-width:3;stroke-dasharray:9 5}.lan{fill:none;stroke:#7e8ba0;stroke-width:2}
</style></defs>
