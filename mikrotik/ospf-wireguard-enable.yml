---
- name: Enable direct OSPF on existing MikroTik WireGuard interfaces
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/main.yml
    - vars/ospf-topology.yml
  vars:
    ospf_wireguard_enabled: true
  tasks:
    - ansible.builtin.include_tasks: ospf-wireguard-enable-router.yml
      loop: '{{ ospf_routers }}'
      loop_control: {loop_var: ospf_router, label: '{{ ospf_router.identity }}'}
    - name: Verify all tunnel neighbors and MikroTik loopbacks
      ansible.builtin.include_tasks: ospf-verify.yml
      loop: '{{ ospf_routers }}'
      loop_control: {loop_var: ospf_router, label: '{{ ospf_router.identity }}'}
