routeros_records:
- path: /interface bridge
  values:
    name: LAN
    port-cost-mode: short
  selector:
    name: LAN
  create: true
- path: /interface ethernet
  selector:
    default-name: ether1
  values:
    comment: ISP Beeline
    mac-address: B8:69:F4:70:83:3A
- path: /interface ethernet
  selector:
    default-name: ether2
  values:
    comment: MAMA
    mac-address: B8:69:F4:70:83:3B
- path: /interface ethernet
  selector:
    default-name: ether3
  values:
    comment: HP
    mac-address: B8:69:F4:70:83:3C
- path: /interface ethernet
  selector:
    default-name: ether4
  values:
    mac-address: B8:69:F4:70:83:3D
- path: /interface ethernet
  selector:
    default-name: ether5
  values:
    mac-address: B8:69:F4:70:83:3E
- path: /interface l2tp-client
  values:
    connect-to: 86.110.170.70
    disabled: 'no'
    name: l2tp-to_k16_k112
    password: '{{ routeros_secrets.record_6_password }}'
    user: k16_21
  selector:
    name: l2tp-to_k16_k112
  create: true
- path: /interface wireless
  selector:
    default-name: wlan1
  values:
    disabled: 'no'
    frequency: auto
    mode: ap-bridge
    name: wlan2
    ssid: TP-LINK_21
- path: /interface wireless security-profiles
  selector:
    default: 'yes'
  values:
    authentication-types: wpa2-psk
    mode: dynamic-keys
    supplicant-identity: MikroTik
    wpa2-pre-shared-key: '{{ routeros_secrets.record_8_wpa2_pre_shared_key }}'
- path: /ip pool
  values:
    name: dhcp_pool0
    ranges: 10.11.0.100-10.11.0.199
  selector:
    name: dhcp_pool0
  create: true
- path: /ip dhcp-server
  values:
    address-pool: dhcp_pool0
    interface: LAN
    lease-time: 10m
    name: dhcp1
  selector:
    name: dhcp1
  create: true
- path: /ip smb users
  selector:
    default: 'yes'
  values:
    disabled: 'yes'
- path: /interface sstp-client
  values:
    authentication: mschap2
    comment: sstp-to-vds7
    connect-to: 62.60.216.73
    disabled: 'no'
    http-proxy: 0.0.0.0
    name: sstp-vds7
    password: '{{ routeros_secrets.record_12_password }}'
    profile: default-encryption
    tls-version: only-1.2
    user: k16_k21
  selector:
    name: sstp-vds7
  create: true
- path: /routing table
  values:
    disabled: 'no'
    fib: 'yes'
    name: to_VPNs
  selector:
    name: to_VPNs
  create: true
- path: /system script
  values:
    comment: Wake_on_lan_HP
    dont-require-permissions: 'no'
    name: Wake_on_lan_HP
    owner: admin
    policy: ftp,reboot,read,write,policy,test,password,sniff,sensitive,romon
    source: '{{ routeros_secrets.record_14_source }}'
  selector:
    name: Wake_on_lan_HP
  create: true
- path: /system script
  values:
    comment: Get all google IP addresses
    dont-require-permissions: 'no'
    name: get_google_ips
    owner: admin
    policy: ftp,reboot,read,write,policy,test,password,sniff,sensitive,romon
    source: '{{ routeros_secrets.record_15_source }}'
  selector:
    name: get_google_ips
  create: true
- path: /interface bridge port
  values:
    bridge: LAN
    interface: ether2
    internal-path-cost: '10'
    path-cost: '10'
  selector:
    interface: ether2
  create: true
- path: /interface bridge port
  values:
    bridge: LAN
    interface: ether3
    internal-path-cost: '10'
    path-cost: '10'
  selector:
    interface: ether3
  create: true
- path: /interface bridge port
  values:
    bridge: LAN
    interface: ether4
    internal-path-cost: '10'
    path-cost: '10'
  selector:
    interface: ether4
  create: true
- path: /interface bridge port
  values:
