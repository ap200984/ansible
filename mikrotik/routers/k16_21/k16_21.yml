    interface: ether5
    internal-path-cost: '10'
    path-cost: '10'
  selector:
    interface: ether5
  create: true
- path: /interface bridge port
  values:
    bridge: LAN
    interface: wlan2
    internal-path-cost: '10'
    path-cost: '10'
  selector:
    interface: wlan2
  create: true
- path: /ip firewall connection tracking
