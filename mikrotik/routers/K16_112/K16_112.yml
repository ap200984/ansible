routeros_records:
- path: /interface bridge
  values:
    name: LAN
  selector:
    name: LAN
  create: true
- path: /interface bridge
  values:
    comment: Router loopback
    name: loopback
    protocol-mode: none
  selector:
    name: loopback
  create: true
- path: /interface ethernet
  selector:
    default-name: ether2
  values:
    comment: Loggia_kitchen
- path: /interface ethernet
  selector:
    default-name: ether4
  values:
    comment: Beeline
- path: /interface ethernet
  selector:
    default-name: ether5
  values:
    comment: TTK
- path: /interface wifi
  selector:
    default-name: wifi2
  values:
    channel.band: 2ghz-ax
    channel.skip-dfs-channels: 10min-cac
    channel.width: 20/40mhz
    configuration.country: Spain
    configuration.mode: ap
    configuration.ssid: Ath1
    disabled: 'no'
    name: wifi_2g
    security.authentication-types: wpa2-psk,wpa3-psk
    security.ft: 'yes'
    security.ft-over-ds: 'yes'
    security.passphrase: '{{ routeros_secrets.record_4_security_passphrase }}'
- path: /interface wifi
  selector:
    default-name: wifi1
  values:
    channel.band: 5ghz-ax
    channel.skip-dfs-channels: 10min-cac
    channel.width: 20/40/80mhz
    configuration.country: Spain
    configuration.mode: ap
    configuration.ssid: Ath1
    disabled: 'no'
    name: wifi_5g
    security.authentication-types: wpa2-psk,wpa3-psk
    security.ft: 'yes'
    security.ft-over-ds: 'yes'
    security.passphrase: '{{ routeros_secrets.record_5_security_passphrase }}'
- path: /interface gre
  values:
    allow-fast-path: 'no'
    comment: GRE to VDS6 over OSPF loopbacks
    keepalive: ''
    local-address: 10.255.0.112
    mtu: '1300'
    name: gre-vds6
    remote-address: 10.255.0.6
  unset:
  - keepalive
  selector:
    name: gre-vds6
  create: true
- path: /interface veth
