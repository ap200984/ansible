routeros_records:
- path: /interface wireguard
  values:
    name: wg_vds8
    listen-port: '37973'
    mtu: '1420'
    private-key: '{{ wg_vds8_private_key_Misha }}'
  selector:
    name: wg_vds8
  create: true
- path: /interface wireguard peers
  values:
    interface: wg_vds8
    name: wg_to_vds8
    public-key: v2z1skxkx4HI6BCbrbxscOZpvHEGak1AkSpWrHe3+jQ=
    endpoint-address: 194.113.106.136
    endpoint-port: '56699'
    allowed-address: 10.250.1.8/32
    persistent-keepalive: 25s
  selector:
    name: wg_to_vds8
  create: true
- path: /ip address
  values:
    address: 10.250.1.24/32
    interface: wg_vds8
