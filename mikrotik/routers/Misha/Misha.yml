    band: 2ghz-b/g/n
    channel-width: 20/40mhz-eC
    disabled: 'no'
    frequency: auto
    mode: ap-bridge
    name: wlan1
    ssid: Leming's Wi-fi
    station-roaming: enabled
- path: /interface wireless
