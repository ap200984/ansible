    action: lookup-only-in-table
    disabled: 'no'
    routing-mark: out_ISP2_only
    table: out_ISP2_only
  selector:
    routing-mark: out_ISP2_only
    table: out_ISP2_only
  create: true
- path: /snmp
  values:
    enabled: 'yes'
- path: /system clock
  values:
    time-zone-name: Europe/Moscow
- path: /system identity
  values:
    name: Misha
- path: /system ntp client
  values:
    mode: broadcast
- path: /system routerboard settings
  values:
    auto-upgrade: 'yes'
- path: /system scheduler
  values:
    days: ''
    disabled: 'yes'
    interval: 30s
    name: ISPs_check
    on-event: '{{ routeros_secrets.record_259_on_event }}'
    policy: ftp,reboot,read,write,policy,test,password,sniff,sensitive,romon
    start-time: startup
  unset:
  - days
  selector:
    name: ISPs_check
  create: true
- path: /system scheduler
  values:
    days: ''
    interval: 1d
    name: get_google_ips
    on-event: '{{ routeros_secrets.record_260_on_event }}'
    policy: read,write,test
    start-date: '2024-11-16'
    start-time: 01:00:00
  unset:
  - days
  selector:
    name: get_google_ips
  create: true
- path: /system scheduler
  values:
    days: ''
    interval: 1d
    name: get_telegram_ips
    on-event: '{{ routeros_secrets.record_b9cd69258a12dd2b560af127 }}'
    policy: read,write,test
    start-date: '2026-10-12'
    start-time: 01:05:00
  unset:
  - days
  selector:
    name: get_telegram_ips
  create: true
- path: /system scheduler
  values:
    days: ''
    interval: 1d
    name: get_meta_ips
    on-event: '{{ routeros_secrets.record_4d2781f5bea3a11fbb0c8d64 }}'
    policy: read,write,test
    start-date: '2026-10-12'
    start-time: 01:10:00
  unset:
  - days
  selector:
    name: get_meta_ips
  create: true
