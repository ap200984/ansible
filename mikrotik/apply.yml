---
- name: Apply MikroTik configuration using SSH
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    router_identity: Logia_Kitchen
  vars_files:
    - "{{ playbook_dir }}/vault/common.yml"
    - "{{ playbook_dir }}/host_vars/{{ router_identity }}.yml"
    - "{{ playbook_dir }}/routers/{{ router_identity }}/{{ router_identity }}.yml"
    - "{{ playbook_dir }}/routers/{{ router_identity }}/vault/secrets_{{ router_identity }}.yml"
  tasks:
    - name: Ensure bandwidth-test group and user exist
      ansible.builtin.command:
        argv:
          - ssh
          - -F
          - /dev/null
          - -i
          - "{{ router_ssh_key | expanduser }}"
          - -p
          - "{{ router_port | default(22) | string }}"
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - 'UserKnownHostsFile={{ router_known_hosts_file | default(lookup("env", "PWD") + "/mikrotik/known_hosts") }}'
          - -o
          - 'ProxyCommand={{ router_proxy_command | default("none") }}'
          - "{{ router_user }}@{{ router_host }}"
          - >-
            :local g [/user group find where name="bandwidth-test"];
            :if ([:len $g] = 0) do={/user group add name="bandwidth-test" policy=test,winbox}
            else={/user group set $g policy=test,winbox};
            :local u [/user find where name="bandwidth-test"];
            :if ([:len $u] = 0) do={/user add name="bandwidth-test"
            group="bandwidth-test" password="{{ bandwidth_test_password }}" disabled=no}
            else={/user set $u group="bandwidth-test"
            password="{{ bandwidth_test_password }}" disabled=no}
      no_log: true
      tags:
        - bandwidth_test_user

    - name: Stage the CHR AmneziaWG container image on a rebuilt router
      ansible.builtin.command:
        argv:
          - ssh
          - -F
          - /dev/null
          - -i
          - '{{ router_ssh_key | expanduser }}'
          - -p
          - '{{ router_port | string }}'
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - 'UserKnownHostsFile={{ router_known_hosts_file | default(lookup("env", "PWD") + "/mikrotik/known_hosts") }}'
          - -o
          - 'ProxyCommand={{ router_proxy_command | default("none") }}'
          - '{{ router_user }}@{{ router_host }}'
          - >-
            :if ([:len [/file find where name="chr-awg-proxy-v1.4.2-amd64.tar.gz"]] = 0) do={
            /tool fetch url="https://github.com/timbrs/amneziawg-mikrotik-c/releases/download/v1.4.2/awg-proxy-amd64.tar.gz"
            dst-path="chr-awg-proxy-v1.4.2-amd64.tar.gz"; :put "IMAGE_STAGED" }
      register: chr_restore_image
      changed_when: "'IMAGE_STAGED' in chr_restore_image.stdout"
      failed_when: chr_restore_image.rc != 0 or 'failure:' in chr_restore_image.stdout
      when: router_identity == 'vds7_CHR'

    - name: Reconcile exported configuration
      routeros_ssh:
        host: "{{ router_host }}"
        user: "{{ router_user }}"
        port: "{{ router_port | default(22) }}"
        identity_file: "{{ router_ssh_key }}"
        known_hosts_file: '{{ router_known_hosts_file | default(lookup("env", "PWD") + "/mikrotik/known_hosts") }}'
        proxy_command: '{{ router_proxy_command | default("none") }}'
        # Environment lists must exist before container creation.
        records: '{{ (routeros_records | rejectattr("path", "equalto", "/container") | list) + (routeros_records | selectattr("path", "equalto", "/container") | list) }}'
      no_log: true

    - name: Enforce routed internal traffic after reconciling captured NAT rules
      ansible.builtin.include_tasks: source-nat-router.yml
      vars:
        router_variables: '{{ playbook_dir }}/host_vars/{{ router_identity }}.yml'
