---
- name: Verify only wg0 plain and wg1 Amnezia remain on Linux
  hosts: vds1:vds2:vds5:vds6:vds8
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify exact interfaces, OSPF neighbors, services and internal routing
      ansible.builtin.shell: |
        set -eu
        test -f /etc/wireguard/linux-normalized.enabled
        test "$(wg show interfaces)" = wg0
        {% if amneziawg_enabled | bool %}
        test "$(awg show interfaces)" = wg1
        systemctl is-active amneziawg-routing
        {% endif %}
        systemctl is-active wg-quick@wg0
        systemctl is-enabled wg-quick@wg0
        {% if inventory_hostname in chr_plain_wg_hosts %}
        systemctl is-active wireguard-routing
        {% endif %}
        {% for interface in (['wg0','wg1'] if amneziawg_enabled | bool else ['wg0']) %}
        {{ 'awg' if interface == 'wg1' else 'wg' }} show {{ interface }} persistent-keepalive | awk '$2 != "off" && $2 != "0" {exit 1}'
        {% endfor %}
        vtysh -c 'show ip ospf neighbor' | awk '$1 == "10.255.0.7" && $3 ~ /^Full/ && $7 ~ /^{{ "wg1" if inventory_hostname in chr_native_awg_hosts else "wg0" }}:/ {ok=1} END {if (!ok) exit 1}'
        {% if inventory_hostname in chr_plain_wg_hosts %}
        {% for peer in ([2,6] if inventory_hostname == 'vds5' else [5]) %}
        vtysh -c 'show ip ospf neighbor' | awk '$1 == "10.255.0.{{ peer }}" && $3 ~ /^Full/ && $7 ~ /^wg0:/ {ok=1} END {if (!ok) exit 1}'
        {% endfor %}
        {% endif %}
        {% if amneziawg_enabled | bool %}
        {% for peer in amneziawg_peers[inventory_hostname] %}
        vtysh -c 'show ip ospf neighbor' | awk '$1 == "10.255.0.{{ peer[3:] }}" && $3 ~ /^Full/ && $7 ~ /^wg1:/ {ok=1} END {if (!ok) exit 1}'
        {% endfor %}
        {% endif %}
        {% if inventory_hostname in ['vds1','vds8'] %}
        vtysh -c 'show ip ospf neighbor' | awk '$3 ~ /^Full/ && $7 ~ /^wg0:/ {n++} END {if (n != 4) exit 1}'
        {% endif %}
        for dst in 10.255.0.1 10.255.0.2 10.255.0.5 10.255.0.6 10.255.0.7 10.255.0.8 10.9.0.1 10.9.1.1 10.255.0.21; do
          ping -I 10.255.0.{{ inventory_hostname[3:] }} -c 2 -W 3 "$dst"
        done
        iptables -t nat -C POSTROUTING -s 10.0.0.0/8 -d 10.0.0.0/8 -m comment --comment internal-10-no-snat -j ACCEPT
        vtysh -c 'show ip ospf neighbor'
      register: normalized_verification
      changed_when: false
      until: normalized_verification.rc == 0
      retries: 24
      delay: 5
      when: inventory_hostname in (linux_wg_normalized_hosts | default([]))
