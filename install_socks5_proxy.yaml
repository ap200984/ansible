---
# Custom password:
#   ansible-playbook -i inventory/vds6 install_socks5_proxy.yaml \
#     -e socks5_proxy_password='change-me'
# No authentication:
#   ansible-playbook -i inventory/vds6 install_socks5_proxy.yaml \
#     -e socks5_proxy_password=''
- name: Install SOCKS5 proxy
  hosts: all
  become: true

  vars_files:
    - vars/install.yml

  vars:
    socks5_proxy_container_name: socks5
    socks5_proxy_image: serjs/go-socks5-proxy
    socks5_proxy_port: 1980
    socks5_proxy_user: proxy

  roles:
    - apt_sources
    - docker

  tasks:
    - name: Create Docker network for SOCKS5
      community.docker.docker_network:
        name: "{{ docker_network_name }}"
        ipam_config:
          - subnet: "{{ docker_network_subnet }}"
            iprange: "{{ docker_network_range }}"

    - name: Start SOCKS5 proxy
      community.docker.docker_container:
        name: "{{ socks5_proxy_container_name }}"
        image: "{{ socks5_proxy_image }}"
        networks:
          - name: "{{ docker_network_name }}"
        env: >-
          {{
            {
              'PROXY_USER': socks5_proxy_user,
              'PROXY_PASSWORD': socks5_proxy_password | string
            }
            if socks5_proxy_password | string | length > 0
            else {}
          }}
        ports:
          - "{{ socks5_proxy_port }}:1080/tcp"
        state: started
        restart_policy: unless-stopped
